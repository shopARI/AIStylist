[pytest]
# Pytest configuration for ARI CrewAI Migration

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 6.0

# Command line options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use API calls)
    e2e: End-to-end tests (full system tests)
    slow: Slow tests (> 1 second)
    asyncio: Async tests

# Asyncio configuration
asyncio_mode = auto

# Coverage settings (if pytest-cov is installed)
[coverage:run]
source = nlp, crews
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
