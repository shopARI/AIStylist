<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARI Data Flow Graph - Interactive Module Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: white;
            overflow: hidden;
        }
        
        .container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            margin: 0 0 5px 0;
            font-size: 1.8em;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            margin: 0;
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        
        .control-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 2px;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }
        
        .control-button:hover {
            background: #5a67d8;
            transform: translateY(-1px);
        }
        
        .control-button.active {
            background: #764ba2;
        }
        
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            min-height: 100px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .info-panel.visible {
            opacity: 1;
        }
        
        .info-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #667eea;
        }
        
        .info-desc {
            font-size: 0.95em;
            line-height: 1.5;
            opacity: 0.9;
        }
        
        .data-types {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .data-type {
            background: rgba(102, 126, 234, 0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            border: 1px solid rgba(102, 126, 234, 0.4);
        }
        
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }
        
        .legend-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #667eea;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px 0;
            font-size: 0.9em;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        
        .svg-container {
            width: 100%;
            height: 100%;
        }
        
        /* Node styles */
        .node {
            cursor: pointer;
            filter: drop-shadow(0 0 6px rgba(0,0,0,0.3));
        }
        
        .node:hover {
            filter: drop-shadow(0 0 12px rgba(102, 126, 234, 0.6));
        }
        
        .node-label {
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            font-size: 11px;
            font-weight: 600;
        }
        
        .node-sublabel {
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            font-size: 8px;
            opacity: 0.8;
        }
        
        /* Link styles */
        .link {
            stroke-width: 2;
            fill: none;
            opacity: 0.7;
            transition: all 0.3s ease;
        }
        
        .link:hover {
            opacity: 1;
            stroke-width: 3;
        }
        
        .link-arrow {
            fill: none;
            stroke-width: 1;
        }
        
        /* Flow animation */
        .flow-particle {
            r: 3;
            opacity: 0.8;
        }
        
        @keyframes flow {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        .flowing {
            animation: flow 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ARI Data Flow Graph</h1>
            <p>Interactive visualization of data flow across system modules</p>
        </div>
        
        <div class="controls">
            <button class="control-button active" onclick="showAllFlows()">All Flows</button>
            <button class="control-button" onclick="showRequestFlow()">Request Flow</button>
            <button class="control-button" onclick="showBattleFlow()">Battle Flow</button>
            <button class="control-button" onclick="showIntelligenceFlow()">Intelligence Flow</button>
            <button class="control-button" onclick="showDataFlow()">Data Flow</button>
            <button class="control-button" onclick="animateFlow()">Animate</button>
        </div>
        
        <div class="info-panel" id="infoPanel">
            <div class="info-title" id="infoTitle">Select a module to see details</div>
            <div class="info-desc" id="infoDesc">Click on any node or connection to learn about data flows</div>
            <div class="data-types" id="dataTypes"></div>
        </div>
        
        <div class="legend">
            <div class="legend-title">Module Types</div>
            <div class="legend-item">
                <div class="legend-color" style="background: #28a745;"></div>
                <span>API Layer</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #dc3545;"></div>
                <span>Services</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #fd7e14;"></div>
                <span>Agents</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #6f42c1;"></div>
                <span>Intelligence</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #17a2b8;"></div>
                <span>Storage</span>
            </div>
        </div>
        
        <svg class="svg-container" id="svg"></svg>
    </div>

    <script>
        // Graph data structure
        const graphData = {
            nodes: [
                // API Layer
                { id: 'fastapi', name: 'FastAPI', type: 'api', layer: 0, x: 400, y: 50, 
                  desc: 'REST API endpoint handling /chat requests with Pydantic validation',
                  dataTypes: ['HTTP Request', 'JSON Payload', 'Session Token'] },
                
                // Service Layer
                { id: 'app_service', name: 'Application\nService', type: 'service', layer: 1, x: 400, y: 150,
                  desc: 'Main orchestrator handling session management and conversation flow',
                  dataTypes: ['User Context', 'Session Data', 'Chat History'] },
                
                { id: 'conversation', name: 'Conversation\nHandler', type: 'service', layer: 1, x: 200, y: 150,
                  desc: 'Manages conversation state and user interactions across sessions',
                  dataTypes: ['Conversation State', 'User Preferences', 'Chat Messages'] },
                
                { id: 'battle_orchestrator', name: 'Battle\nOrchestrator', type: 'service', layer: 1, x: 600, y: 150,
                  desc: 'Coordinates CAMEL agent battles with concurrency control (50 max)',
                  dataTypes: ['Battle Config', 'Agent Results', 'Battle Metrics'] },
                
                // Intelligence Layer
                { id: 'ml_coordinator', name: 'ML Intelligence\nCoordinator', type: 'intelligence', layer: 2, x: 400, y: 250,
                  desc: 'Coordinates 4 ML systems to provide intelligence to battle agents',
                  dataTypes: ['ML Intelligence', 'Behavioral Data', 'Visual Features', 'Memory Context'] },
                
                { id: 'behavioral', name: 'Behavioral\nAnalysis', type: 'intelligence', layer: 2, x: 100, y: 250,
                  desc: 'RFM segmentation and purchase pattern analysis',
                  dataTypes: ['RFM Scores', 'Purchase Patterns', 'User Segments'] },
                
                { id: 'clustering', name: 'Product\nClustering', type: 'intelligence', layer: 2, x: 250, y: 250,
                  desc: 'Product categorization and relationship discovery',
                  dataTypes: ['Cluster IDs', 'Product Relations', 'Category Groups'] },
                
                { id: 'visual', name: 'Visual\nAnalysis', type: 'intelligence', layer: 2, x: 550, y: 250,
                  desc: 'PyTorch-based visual feature extraction and aesthetic scoring',
                  dataTypes: ['Visual Features', 'Color Analysis', 'Style Attributes'] },
                
                { id: 'memory_rag', name: 'Memory\nRAG', type: 'intelligence', layer: 2, x: 700, y: 250,
                  desc: 'Context-aware memory system for personalized recommendations',
                  dataTypes: ['Memory Vectors', 'Context History', 'Preference Patterns'] },
                
                // Agent Battle Layer
                { id: 'cypher_bot', name: 'CypherBot', type: 'agent', layer: 3, x: 300, y: 350,
                  desc: 'CAMEL agent using Neo4j graph relationships for data-driven recommendations',
                  dataTypes: ['Cypher Queries', 'Graph Results', 'Relationship Data'] },
                
                { id: 'judge_ari', name: 'Judge Ari', type: 'agent', layer: 3, x: 400, y: 350,
                  desc: 'CAMEL judge agent evaluating battle results and selecting winners',
                  dataTypes: ['Battle Results', 'Judgment Strategy', 'Winner Selection'] },
                
                { id: 'vibe_bot', name: 'VibeBot', type: 'agent', layer: 3, x: 500, y: 350,
                  desc: 'CAMEL agent using Qdrant vector similarity for aesthetic recommendations',
                  dataTypes: ['Vector Queries', 'Similarity Scores', 'Aesthetic Data'] },
                
                // Data Storage Layer
                { id: 'neo4j', name: 'Neo4j', type: 'database', layer: 4, x: 250, y: 450,
                  desc: 'Graph database with 20-30M product nodes and user relationships',
                  dataTypes: ['Graph Data', 'User Nodes', 'Product Relations', 'Cypher Results'] },
                
                { id: 'qdrant', name: 'Qdrant', type: 'database', layer: 4, x: 400, y: 450,
                  desc: 'Vector database for fashion embeddings and similarity search',
                  dataTypes: ['Vector Embeddings', 'Similarity Scores', 'Product Vectors'] },
                
                { id: 'redis', name: 'Redis', type: 'cache', layer: 4, x: 550, y: 450,
                  desc: 'Distributed cache for sessions, battles, and ML intelligence (1h TTL)',
                  dataTypes: ['Session Cache', 'Battle State', 'ML Cache', 'User Context'] },
                
                // External Services
                { id: 'openai', name: 'OpenAI\nAPI', type: 'external', layer: 4, x: 100, y: 450,
                  desc: 'External API for embeddings and CAMEL agent LLM capabilities',
                  dataTypes: ['Text Embeddings', 'LLM Responses', 'Agent Messages'] }
            ],
            
            links: [
                // Request flow
                { source: 'fastapi', target: 'app_service', type: 'request', 
                  data: 'HTTP Request → JSON Payload', color: '#28a745' },
                { source: 'app_service', target: 'conversation', type: 'session',
                  data: 'Session Management → User Context', color: '#ffc107' },
                { source: 'app_service', target: 'battle_orchestrator', type: 'battle',
                  data: 'Battle Request → Agent Coordination', color: '#dc3545' },
                
                // Intelligence flow
                { source: 'battle_orchestrator', target: 'ml_coordinator', type: 'intelligence',
                  data: 'Intelligence Request → ML Analysis', color: '#6f42c1' },
                { source: 'ml_coordinator', target: 'behavioral', type: 'ml',
                  data: 'User Analysis → Behavioral Data', color: '#6f42c1' },
                { source: 'ml_coordinator', target: 'clustering', type: 'ml',
                  data: 'Product Analysis → Cluster Data', color: '#6f42c1' },
                { source: 'ml_coordinator', target: 'visual', type: 'ml',
                  data: 'Visual Analysis → Style Features', color: '#6f42c1' },
                { source: 'ml_coordinator', target: 'memory_rag', type: 'ml',
                  data: 'Context Retrieval → Memory Vectors', color: '#6f42c1' },
                
                // Battle agent flow
                { source: 'ml_coordinator', target: 'cypher_bot', type: 'intelligence',
                  data: 'Behavioral + Clustering Intelligence', color: '#fd7e14' },
                { source: 'ml_coordinator', target: 'vibe_bot', type: 'intelligence',
                  data: 'Visual + Memory Intelligence', color: '#fd7e14' },
                { source: 'cypher_bot', target: 'judge_ari', type: 'results',
                  data: 'Graph-based Results', color: '#fd7e14' },
                { source: 'vibe_bot', target: 'judge_ari', type: 'results',
                  data: 'Vector-based Results', color: '#fd7e14' },
                
                // Data access flow
                { source: 'cypher_bot', target: 'neo4j', type: 'query',
                  data: 'Cypher Queries → Graph Results', color: '#17a2b8' },
                { source: 'vibe_bot', target: 'qdrant', type: 'query',
                  data: 'Vector Search → Similarity Results', color: '#17a2b8' },
                { source: 'behavioral', target: 'neo4j', type: 'analysis',
                  data: 'Transaction Analysis → User Patterns', color: '#17a2b8' },
                { source: 'clustering', target: 'neo4j', type: 'analysis',
                  data: 'Product Analysis → Category Relations', color: '#17a2b8' },
                { source: 'visual', target: 'qdrant', type: 'analysis',
                  data: 'Feature Extraction → Visual Vectors', color: '#17a2b8' },
                
                // Cache and session flow
                { source: 'conversation', target: 'redis', type: 'cache',
                  data: 'Session Storage → Conversation State', color: '#6c757d' },
                { source: 'battle_orchestrator', target: 'redis', type: 'cache',
                  data: 'Battle Coordination → Active Battles', color: '#6c757d' },
                { source: 'ml_coordinator', target: 'redis', type: 'cache',
                  data: 'Intelligence Cache → ML Results (1h TTL)', color: '#6c757d' },
                
                // External API flow
                { source: 'visual', target: 'openai', type: 'api',
                  data: 'Embedding Requests → Text Vectors', color: '#20c997' },
                { source: 'cypher_bot', target: 'openai', type: 'api',
                  data: 'CAMEL Agent → LLM Responses', color: '#20c997' },
                { source: 'vibe_bot', target: 'openai', type: 'api',
                  data: 'CAMEL Agent → LLM Responses', color: '#20c997' },
                { source: 'judge_ari', target: 'openai', type: 'api',
                  data: 'CAMEL Judge → Evaluation Logic', color: '#20c997' }
            ]
        };

        // Color mapping for node types
        const nodeColors = {
            api: '#28a745',
            service: '#dc3545', 
            intelligence: '#6f42c1',
            agent: '#fd7e14',
            database: '#17a2b8',
            cache: '#6c757d',
            external: '#20c997'
        };

        // SVG setup
        const svg = d3.select('#svg');
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        svg.attr('width', width).attr('height', height);
        
        // Create arrow markers
        const defs = svg.append('defs');
        
        Object.entries(nodeColors).forEach(([type, color]) => {
            defs.append('marker')
                .attr('id', `arrow-${type}`)
                .attr('viewBox', '0 -5 10 10')
                .attr('refX', 25)
                .attr('refY', 0)
                .attr('markerWidth', 6)
                .attr('markerHeight', 6)
                .attr('orient', 'auto')
                .append('path')
                .attr('d', 'M0,-5L10,0L0,5')
                .style('fill', color);
        });

        // Create container groups
        const linkGroup = svg.append('g').attr('class', 'links');
        const nodeGroup = svg.append('g').attr('class', 'nodes');
        
        // Create force simulation
        const simulation = d3.forceSimulation(graphData.nodes)
            .force('link', d3.forceLink(graphData.links).id(d => d.id).distance(100))
            .force('charge', d3.forceManyBody().strength(-300))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(40));

        // Create links
        const links = linkGroup.selectAll('line')
            .data(graphData.links)
            .enter()
            .append('line')
            .attr('class', 'link')
            .style('stroke', d => d.color)
            .attr('marker-end', d => {
                const sourceType = graphData.nodes.find(n => n.id === d.source.id || n.id === d.source)?.type;
                return `url(#arrow-${sourceType})`;
            })
            .on('mouseover', function(event, d) {
                showConnectionInfo(d);
                d3.select(this).style('stroke-width', '4px');
            })
            .on('mouseout', function() {
                d3.select(this).style('stroke-width', '2px');
            });

        // Create nodes
        const nodes = nodeGroup.selectAll('g')
            .data(graphData.nodes)
            .enter()
            .append('g')
            .attr('class', 'node')
            .call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended))
            .on('click', function(event, d) {
                showNodeInfo(d);
            })
            .on('mouseover', function(event, d) {
                d3.select(this).select('circle')
                    .transition()
                    .duration(200)
                    .attr('r', 35);
            })
            .on('mouseout', function(event, d) {
                d3.select(this).select('circle')
                    .transition()
                    .duration(200)
                    .attr('r', 30);
            });

        // Add circles to nodes
        nodes.append('circle')
            .attr('r', 30)
            .style('fill', d => nodeColors[d.type])
            .style('stroke', '#fff')
            .style('stroke-width', 2);

        // Add main labels to nodes
        nodes.append('text')
            .attr('class', 'node-label')
            .attr('dy', -5)
            .style('fill', '#fff')
            .text(d => d.name.split('\n')[0]);
            
        // Add sub labels for multi-line names
        nodes.filter(d => d.name.includes('\n'))
            .append('text')
            .attr('class', 'node-sublabel')
            .attr('dy', 8)
            .style('fill', '#fff')
            .text(d => d.name.split('\n')[1]);

        // Update positions on simulation tick
        simulation.on('tick', () => {
            links
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);

            nodes
                .attr('transform', d => `translate(${d.x},${d.y})`);
        });

        // Drag functions
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        // Information display functions
        function showNodeInfo(node) {
            const panel = d3.select('#infoPanel');
            const title = d3.select('#infoTitle');
            const desc = d3.select('#infoDesc');
            const dataTypes = d3.select('#dataTypes');
            
            title.text(node.name.replace('\n', ' '));
            desc.text(node.desc);
            
            dataTypes.selectAll('.data-type').remove();
            dataTypes.selectAll('.data-type')
                .data(node.dataTypes || [])
                .enter()
                .append('div')
                .attr('class', 'data-type')
                .text(d => d);
            
            panel.classed('visible', true);
        }

        function showConnectionInfo(link) {
            const panel = d3.select('#infoPanel');
            const title = d3.select('#infoTitle');
            const desc = d3.select('#infoDesc');
            const dataTypes = d3.select('#dataTypes');
            
            const sourceName = typeof link.source === 'object' ? link.source.name : 
                               graphData.nodes.find(n => n.id === link.source)?.name;
            const targetName = typeof link.target === 'object' ? link.target.name : 
                               graphData.nodes.find(n => n.id === link.target)?.name;
            
            title.text(`${sourceName.replace('\n', ' ')} → ${targetName.replace('\n', ' ')}`);
            desc.text(link.data);
            
            dataTypes.selectAll('.data-type').remove();
            dataTypes.append('div')
                .attr('class', 'data-type')
                .text(link.type.toUpperCase());
            
            panel.classed('visible', true);
        }

        // Filter functions
        function showAllFlows() {
            setActiveButton('All Flows');
            links.style('opacity', 0.7);
            nodes.style('opacity', 1);
        }

        function showRequestFlow() {
            setActiveButton('Request Flow');
            const requestTypes = ['request', 'session', 'battle'];
            filterFlows(requestTypes);
        }

        function showBattleFlow() {
            setActiveButton('Battle Flow');
            const battleTypes = ['battle', 'intelligence', 'results'];
            filterFlows(battleTypes);
        }

        function showIntelligenceFlow() {
            setActiveButton('Intelligence Flow');
            const intelTypes = ['intelligence', 'ml', 'analysis'];
            filterFlows(intelTypes);
        }

        function showDataFlow() {
            setActiveButton('Data Flow');
            const dataTypes = ['query', 'cache', 'api'];
            filterFlows(dataTypes);
        }

        function filterFlows(types) {
            links.style('opacity', d => types.includes(d.type) ? 1 : 0.1);
            
            const activeNodeIds = new Set();
            graphData.links
                .filter(d => types.includes(d.type))
                .forEach(d => {
                    activeNodeIds.add(typeof d.source === 'object' ? d.source.id : d.source);
                    activeNodeIds.add(typeof d.target === 'object' ? d.target.id : d.target);
                });
            
            nodes.style('opacity', d => activeNodeIds.has(d.id) ? 1 : 0.3);
        }

        function setActiveButton(text) {
            d3.selectAll('.control-button').classed('active', false);
            d3.selectAll('.control-button')
                .filter(function() { return this.textContent === text; })
                .classed('active', true);
        }

        function animateFlow() {
            // Create flow particles
            const particles = svg.selectAll('.flow-particle')
                .data(graphData.links)
                .enter()
                .append('circle')
                .attr('class', 'flow-particle')
                .attr('r', 3)
                .style('fill', d => d.color)
                .style('opacity', 0);

            // Animate particles along links
            particles.each(function(d) {
                const particle = d3.select(this);
                const sourceX = typeof d.source === 'object' ? d.source.x : graphData.nodes.find(n => n.id === d.source).x;
                const sourceY = typeof d.source === 'object' ? d.source.y : graphData.nodes.find(n => n.id === d.source).y;
                const targetX = typeof d.target === 'object' ? d.target.x : graphData.nodes.find(n => n.id === d.target).x;
                const targetY = typeof d.target === 'object' ? d.target.y : graphData.nodes.find(n => n.id === d.target).y;
                
                particle.attr('cx', sourceX).attr('cy', sourceY);
                
                particle.transition()
                    .duration(2000)
                    .ease(d3.easeLinear)
                    .attr('cx', targetX)
                    .attr('cy', targetY)
                    .style('opacity', 1)
                    .transition()
                    .duration(500)
                    .style('opacity', 0)
                    .remove();
            });
        }

        // Make functions global for button access
        window.showAllFlows = showAllFlows;
        window.showRequestFlow = showRequestFlow;
        window.showBattleFlow = showBattleFlow;
        window.showIntelligenceFlow = showIntelligenceFlow;
        window.showDataFlow = showDataFlow;
        window.animateFlow = animateFlow;

        // Handle window resize
        window.addEventListener('resize', () => {
            const newWidth = window.innerWidth;
            const newHeight = window.innerHeight;
            svg.attr('width', newWidth).attr('height', newHeight);
            simulation.force('center', d3.forceCenter(newWidth / 2, newHeight / 2));
        });
    </script>
</body>
</html>
