[pytest]
# Pytest configuration for CrewAI migration tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end flows
    slow: Tests that take longer to execute
    asyncio: Async tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Async support
asyncio_mode = auto
